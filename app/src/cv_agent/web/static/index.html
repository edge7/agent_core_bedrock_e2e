<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat with my CV</title>
<style>
  :root { --bg: #f7f5f0; --ink: #20242b; --accent: #b5563a; --bubble-me: #20242b; --bubble-ai: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Georgia, 'Times New Roman', serif; background: var(--bg); color: var(--ink);
         display: flex; flex-direction: column; height: 100dvh; }
  header { padding: 1rem 1.5rem; border-bottom: 1px solid #e0dcd2; }
  header h1 { margin: 0; font-size: 1.15rem; font-weight: normal; }
  header h1 em { color: var(--accent); }
  #chat { flex: 1; overflow-y: auto; padding: 1.5rem; display: flex; flex-direction: column; gap: .8rem;
          max-width: 760px; width: 100%; margin: 0 auto; }
  .msg { padding: .7rem 1rem; border-radius: 10px; max-width: 85%; line-height: 1.45; white-space: pre-wrap; }
  .me { background: var(--bubble-me); color: #fff; align-self: flex-end; }
  .ai { background: var(--bubble-ai); border: 1px solid #e0dcd2; align-self: flex-start; }
  .ai.error { border-color: var(--accent); color: var(--accent); }
  form { display: flex; gap: .6rem; padding: 1rem 1.5rem; border-top: 1px solid #e0dcd2;
         max-width: 760px; width: 100%; margin: 0 auto; }
  input { flex: 1; padding: .7rem 1rem; font: inherit; border: 1px solid #cfc9bb; border-radius: 8px;
          background: #fff; outline: none; }
  input:focus { border-color: var(--accent); }
  button { padding: .7rem 1.2rem; font: inherit; border: 0; border-radius: 8px; background: var(--ink);
           color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header><h1>Ask me anything <em>about my experience</em></h1></header>
<div id="chat"></div>
<form id="form">
  <input id="input" placeholder="e.g. What's your experience with AWS?" autocomplete="off" autofocus>
  <button id="send" type="submit">Send</button>
</form>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');

const sessionId = sessionStorage.getItem('cv-agent-session')
  ?? (sessionStorage.setItem('cv-agent-session', crypto.randomUUID()),
      sessionStorage.getItem('cv-agent-session'));

function addBubble(cls, text = '') {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  send.disabled = true;
  addBubble('me', message);
  const bubble = addBubble('ai');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split('\n\n');
      buffer = events.pop();  // keep incomplete chunk
      for (const ev of events) {
        const data = ev.replace(/^data: /, '');
        if (data === '[DONE]') continue;
        const payload = JSON.parse(data);
        if (payload.error) {
          bubble.classList.add('error');
          bubble.textContent = 'Something went wrong: ' + payload.error;
        } else {
          bubble.textContent += payload.text;
        }
        chat.scrollTop = chat.scrollHeight;
      }
    }
  } catch (err) {
    bubble.classList.add('error');
    bubble.textContent = 'Connection error: ' + err.message;
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
